<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#111122"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e0c3fc" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="2" height="4">
      <rect width="2" height="2" fill="transparent"/>
      <rect y="2" width="2" height="2" fill="rgba(0,0,0,0.25)"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="16" y="18" width="96" height="64" rx="6"/>
    </clipPath>
  </defs>

  <!-- Shadow -->
  <ellipse cx="64" cy="116" rx="48" ry="6" fill="rgba(0,0,0,0.3)"/>

  <!-- TV body -->
  <rect x="8" y="8" width="112" height="96" rx="16" fill="url(#body)" stroke="#4c1d95" stroke-width="2"/>

  <!-- Inner bezel -->
  <rect x="14" y="16" width="100" height="68" rx="8" fill="#0f0f1a" stroke="#6d28d9" stroke-width="1" opacity="0.6"/>

  <!-- Screen -->
  <rect x="16" y="18" width="96" height="64" rx="6" fill="url(#screen)"/>

  <!-- Screen glow -->
  <rect x="16" y="18" width="96" height="64" rx="6" fill="url(#glow)"/>

  <!-- Scanlines -->
  <rect x="16" y="18" width="96" height="64" rx="6" fill="url(#scanlines)" clip-path="url(#screenClip)"/>

  <!-- Video content icon - play triangle -->
  <polygon points="52,36 52,64 76,50" fill="#e0c3fc" opacity="0.7"/>

  <!-- Screen edge highlight -->
  <rect x="16" y="18" width="96" height="64" rx="6" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.3"/>

  <!-- Control panel -->
  <rect x="24" y="88" width="80" height="10" rx="4" fill="#1a1a2e" stroke="#4c1d95" stroke-width="1"/>

  <!-- Control buttons -->
  <circle cx="42" cy="93" r="2.5" fill="#6d28d9"/>
  <circle cx="52" cy="93" r="2.5" fill="#6d28d9"/>
  <rect x="62" y="91" width="8" height="4" rx="1.5" fill="#6d28d9"/>
  <rect x="74" y="91" width="8" height="4" rx="1.5" fill="#6d28d9"/>

  <!-- Power light -->
  <circle cx="90" cy="93" r="2" fill="#10b981" opacity="0.8"/>
  <circle cx="90" cy="93" r="3" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.4"/>

  <!-- Antenna -->
  <line x1="64" y1="8" x2="64" y2="0" stroke="#4c1d95" stroke-width="2" stroke-linecap="round"/>
  <line x1="64" y1="0" x2="52" y2="3" stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="64" y1="0" x2="76" y2="3" stroke="#4c1d95" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="52" cy="3" r="1.5" fill="#7c3aed"/>
  <circle cx="76" cy="3" r="1.5" fill="#7c3aed"/>
</svg>
