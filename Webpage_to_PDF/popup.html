<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f8fafc;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 16px;
      text-align: center;
    }
    .mode-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-selector button {
      flex: 1;
      padding: 8px 4px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
      transition: all 0.15s;
      text-align: center;
    }
    .mode-selector button:hover { border-color: #a5b4fc; }
    .mode-selector button.active {
      border-color: #4f46e5;
      background: #eef2ff;
      color: #4f46e5;
    }
    .mode-selector button .icon {
      font-size: 20px;
      display: block;
      margin-bottom: 4px;
    }
    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .option-row label {
      font-size: 13px;
      color: #475569;
    }
    .option-row select,
    .option-row input[type="number"] {
      width: 110px;
      padding: 4px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      background: white;
      outline: none;
    }
    .option-row select:focus,
    .option-row input[type="number"]:focus {
      border-color: #4f46e5;
    }
    .option-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #4f46e5;
    }
    hr { border: none; border-top: 1px solid #e2e8f0; margin: 12px 0; }
    #convertBtn {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #convertBtn:hover { background: #4338ca; }
    #convertBtn:disabled { background: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
      min-height: 18px;
    }
    .error { color: #dc2626; }
    .footer {
      margin-top: 12px;
      text-align: center;
    }
    .footer a {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: none;
      cursor: pointer;
    }
    .footer a:hover { color: #4f46e5; }
    .note {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Webpage to PDF</h1>

  <div class="mode-selector">
    <button id="modeNormal" class="active">
      <span class="icon">📄</span>
      Text PDF
    </button>
    <button id="modeScreenshot">
      <span class="icon">🖼️</span>
      Screenshot
    </button>
  </div>

  <div class="option-row">
    <label for="orientation">Orientation</label>
    <select id="orientation">
      <option value="portrait">Portrait</option>
      <option value="landscape">Landscape</option>
    </select>
  </div>

  <div class="option-row">
    <label for="paperSize">Paper Size</label>
    <select id="paperSize">
      <option value="a4">A4</option>
      <option value="letter" selected>Letter</option>
      <option value="legal">Legal</option>
    </select>
  </div>

  <div class="option-row">
    <label for="background">Background graphics</label>
    <input type="checkbox" id="background" checked />
  </div>

  <div class="option-row">
    <label for="scale">Scale (%)</label>
    <input type="number" id="scale" value="100" min="10" max="200" />
  </div>

  <hr />

  <button id="convertBtn">Convert to PDF</button>
  <div id="status">Ready</div>
  <div class="note" id="modeNote">Text-based PDF with selectable text</div>

  <div class="footer">
    <a id="optionsLink">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
