<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IMDb → StreamIMDb Settings</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 6px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 16px; padding: 8px 20px; }
    .hint { font-size: 0.85em; color: #555; margin-top: 2px; }
    #status { margin-top: 10px; color: green; }
  </style>
</head>
<body>
  <h2>IMDb → StreamIMDb Settings</h2>
  <p>Use <code>$1</code>, <code>$2</code> etc. to reference captured groups in the source pattern.</p>

  <label>Source URL pattern (regex)</label>
  <input id="fromPattern" placeholder="https://www\.imdb\.com/title/(tt\d+)">
  <div class="hint">The regex string used to match the current tab URL.</div>

  <label>Destination URL pattern</label>
  <input id="toPattern" placeholder="https://streamimdb.ru/embed/tv/$1">
  <div class="hint">The URL to redirect to, using $1, $2 etc. for captured groups.</div>

  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
