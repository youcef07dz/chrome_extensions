<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Memory Heatmap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div>
        <h1>Tab Memory Heatmap</h1>
        <p class="subtitle">Total: <span id="total-memory">Calculating...</span></p>
      </div>
    </div>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot green"></span>Low (&lt;150MB)</span>
      <span class="legend-item"><span class="legend-dot yellow"></span>Medium (150-350MB)</span>
      <span class="legend-item"><span class="legend-dot red"></span>High (&gt;350MB)</span>
    </div>

    <div id="tab-list" class="tab-list"></div>

    <div class="settings-row">
      <label class="checkbox-row">
        <input type="checkbox" id="show-bar-toggle" checked>
        <span>Color bar on active tab</span>
      </label>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
