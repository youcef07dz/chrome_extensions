<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Cropper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <path d="M14 3h7"/>
          <path d="M3 14v7"/>
        </svg>
      </div>
      <div>
        <h1>Page Cropper</h1>
        <p class="subtitle">Select and save any part of a page</p>
      </div>
    </div>

    <div id="status" class="status">
      Click "Start Cropping" to begin
    </div>

    <button id="crop-btn" class="primary-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M3 7V3h4"/>
        <path d="M21 7V3h-4"/>
        <path d="M3 17v4h4"/>
        <path d="M21 17v4h-4"/>
      </svg>
      Start Cropping
    </button>

    <div class="preview-section" id="preview-section" style="display: none;">
      <p class="section-title">Preview</p>
      <div class="preview-container">
        <img id="preview-image" src="" alt="Cropped selection">
      </div>
      <p class="dimensions" id="dimensions"></p>
    </div>

    <div class="export-section" id="export-section" style="display: none;">
      <p class="section-title">Export As</p>
      <div class="export-buttons">
        <button id="png-btn" class="export-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          PNG
        </button>
        <button id="jpg-btn" class="export-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          JPG
        </button>
        <button id="pdf-btn" class="export-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          PDF
        </button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
