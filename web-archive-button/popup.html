<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Archive Button</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="" class="logo">
      <h1>Web Archive</h1>
    </div>

    <div id="url-display" class="url-display"></div>

    <button id="save-btn" class="save-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      Save to Wayback Machine
    </button>

    <div id="status" class="status" style="display: none;"></div>

    <div id="result" class="result" style="display: none;">
      <a id="archive-link" href="#" target="_blank" rel="noopener noreferrer">
        View archived page
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </a>
    </div>

    <button id="check-btn" class="secondary-btn">Check if already archived</button>
    <div id="check-status" class="check-status" style="display: none;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
