<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube History</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="28" height="28">
          <path fill="#ff0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span class="brand-name">YouTube History</span>
      </div>
    </div>
    <div class="header-center">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search saved videos...">
        <button id="searchBtn">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="header-right">
      <div class="view-toggle" title="Toggle view">
        <button id="gridViewBtn" class="view-btn active">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M3 3h8v8H3V3zm0 10h8v8H3v-8zM13 3h8v8h-8V3zm0 10h8v8h-8v-8z"/>
          </svg>
        </button>
        <button id="listViewBtn" class="view-btn">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/>
          </svg>
        </button>
      </div>
      <button id="trashBtn" class="icon-btn" title="Blacklist">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8 0-1.85.63-3.55 1.69-4.9L16.9 18.31C15.55 19.37 13.85 20 12 20zm6.31-3.1L7.1 5.69C8.45 4.63 10.15 4 12 4c4.42 0 8 3.58 8 8 0 1.85-.63 3.55-1.69 4.9z"/>
        </svg>
      </button>
      <button id="exportBtn" class="icon-btn" title="Backup (Export)">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
      </button>
      <button id="importBtn" class="icon-btn" title="Restore (Import)">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
        </svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
        </svg>
      </button>
      <div id="actionBtnGroup" class="action-btn-group">
        <button id="deleteAllBtn" class="icon-btn delete-all-btn" title="Delete all videos">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
        </button>
      </div>
      <span id="videoCount" class="video-count">0 videos</span>
    </div>
  </header>

  <main>
    <div id="videoContainer" class="video-grid"></div>
    <div id="emptyState" class="empty-state">
      <svg viewBox="0 0 24 24" width="80" height="80">
        <path fill="#555" d="M10 8v8l5-4-5-4zm9-5H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/>
      </svg>
      <h2 id="emptyTitle">No videos saved yet</h2>
      <p id="emptyDesc">Browse YouTube and videos will be saved automatically.</p>
    </div>
  </main>

  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button id="closeSettingsBtn" class="icon-btn">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="setting-row">
          <span>Max saved videos</span>
          <input type="number" id="maxVideosInput" min="10" max="100000" value="1000">
        </label>
        <p class="setting-hint">When the limit is reached, the oldest videos are automatically removed.</p>
        <label class="setting-row">
          <span>Save</span>
          <select id="saveFilterSelect">
            <option value="all">All (Videos & Shorts)</option>
            <option value="videos">Videos only</option>
            <option value="shorts">Shorts only</option>
          </select>
        </label>
        <p class="setting-hint">Choose which content to save when browsing YouTube.</p>
        <label class="setting-row">
          <span>Theme</span>
          <select id="themeSelect">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </label>
        <p class="setting-hint">Choose your preferred appearance.</p>
      </div>
      <div class="modal-footer">
        <button id="saveSettingsBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal" style="width:380px">
      <div class="modal-header">
        <h2 id="confirmTitle">Confirm</h2>
      </div>
      <div class="modal-body">
        <p id="confirmMessage" style="font-size:14px"></p>
      </div>
      <div class="modal-footer" style="display:flex;gap:8px">
        <button id="confirmNo" class="btn-cancel">Cancel</button>
        <button id="confirmYes" class="btn-primary" style="background:#ff4444">Confirm</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFileInput" accept=".json" style="display:none">

  <div id="toast" class="toast"></div>

  <script src="history.js"></script>
</body>
</html>
