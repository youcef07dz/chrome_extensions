<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suspended Tab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 40px;
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #1e293b;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 40px;
      height: 40px;
      stroke: #6366f1;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .tab-title {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .restore-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .restore-btn:hover {
      background: #4f46e5;
    }

    .stats {
      margin-top: 32px;
      font-size: 13px;
      color: #64748b;
    }

    .url-preview {
      margin-top: 12px;
      font-size: 12px;
      color: #475569;
      max-width: 500px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
        <path d="M12 7v4"/>
        <circle cx="12" cy="7" r="1"/>
      </svg>
    </div>
    <h1>Tab Suspended</h1>
    <p class="tab-title" id="tab-title"></p>
    <button class="restore-btn" id="restore-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 3 21 3 21 9"/>
        <path d="M21 3l-7 7"/>
        <path d="M3 11a9 9 0 0 1 9-9 9 9 0 0 1 6.36 2.64L21 3"/>
      </svg>
      Restore Tab
    </button>
    <p class="url-preview" id="url-preview"></p>
    <p class="stats">Memory freed by suspending this tab</p>
  </div>

  <script src="suspended.js"></script>
</body>
</html>
