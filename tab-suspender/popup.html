<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Suspender</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="" class="logo">
      <div>
        <h1>Tab Suspender</h1>
        <p class="subtitle">Free up memory by suspending inactive tabs</p>
      </div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label">Extension enabled</span>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="settings-section">
      <div class="setting-label">
        <span>Suspend after inactivity</span>
        <select id="timeout-select">
          <option value="5">5 minutes</option>
          <option value="10">10 minutes</option>
          <option value="15">15 minutes</option>
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
          <option value="120">2 hours</option>
          <option value="custom">Custom...</option>
        </select>
      </div>
      <div class="setting-custom-row" id="timeout-custom-row">
        <input type="number" id="timeout-input" min="0.1" max="9999" step="0.1" placeholder="Minutes">
        <span class="custom-unit">minutes</span>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="skip-pinned" checked>
        <label for="skip-pinned">Skip pinned tabs</label>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="skip-audio" checked>
        <label for="skip-audio">Skip tabs playing audio</label>
      </div>
    </div>

    <div class="tabs-section">
      <div class="tabs-header">
        <span>Open Tabs</span>
        <button id="suspend-all-btn" class="small-btn">Suspend All</button>
      </div>
      <div id="tab-list" class="tab-list"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
